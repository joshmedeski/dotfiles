# Terminal multiplexer
# https://github.com/tmux/tmux

bind-key "K" new-pane -O -C -B none -x 100% -y 100% -X 0 -Y 0 "sesh picker -idHs"
bind-key "S" new-pane -O -C -B none -x 100% -y 100% -X 0 -Y 0 "hud"
bind-key "!" new-pane -O -C -B none -x 100% -y 100% -X 0 -Y 0 "sesh picker -idHs --query '#'"
# bind-key "R" display-popup -B -h 100% -w 100% -y S -E "sesh picker -ids --query \"\$(sesh root)\""
bind-key "R" new-pane -O -C -B none -x 100% -y 100% -X 0 -Y 0 "sesh worktree picker || tmux display-message -d 1000 'No worktrees detected'"

# TODO: learn how this works
set-option -g focus-events on

# TODO: find a way to toggle this?
set-option -g display-time 3000

# colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g theme terminal

set -g base-index 1               # start indexing windows at 1 instead of 0
set -g detach-on-destroy off      # don't exit from tmux when closing a session
set -g escape-time 0              # zero-out escape time delay
set -g extended-keys on           # enable extended keys (e.g., ctrl+shift+letter)
set -g extended-keys-format csi-u # encode modified keys using CSI u format
set -g history-limit 1000000      # increase history size (from 2,000)
set -g mouse on                   # enable mouse support
set -g renumber-windows on        # renumber all windows when any window is closed
set -g set-clipboard on           # use system clipboard

# ascii color definitions
# 0  black
# 1  red
# 2  green
# 3  yellow
# 4  blue
# 5  magenta
# 6  cyan
# 7  white
# 8  bright black
# 9  bright red
# 10 bright green
# 11 bright yellow
# 12 bright blue
# 13 bright magenta
# 14 bright cyan
# 15 bright white
# -1 default

# status bar
set -g status-interval 3
set -g status-justify right
set -g status-left "#[fg=blue,bold]#S #[fg=white,nobold]#(gitmux -cfg $HOME/.config/tmux/gitmux.yml)"
# set -g status-left "#[fg=blue,bold]#S #[fg=white,nobold]#(gitmux -cfg $HOME/.config/tmux/gitmux.yml) #{@gh_issue}"
# set -g status-left "#[fg=blue,bold]#S"
set -g status-left-length 200    # increase length (from 10)
set -g status-position top       # macOS / darwin style
set -g status-right ""
set -g status-style 'bg=default' # transparent
set -g popup-style 'bg=default'
set -g popup-border-style 'bg=default'

# windows
set -g window-status-current-format '#[fg=white]#{?@spinner,#{@spinner},#W}'
set -g window-status-format '#[fg=white]#{?@spinner,#{@spinner},#W}'

# panes
set -g pane-border-lines spaces # draw borders with spaces (no glyphs) for a minimal look
# set -g pane-active-border-style 'fg=black,bg=default'
# set -g pane-border-style 'fg=brightblack,bg=default'

set -g allow-passthrough on
set -g message-command-style bg=default,fg=yellow
set -g message-style bg=default,fg=yellow
set -g mode-style bg=default,fg=yellow

# hooks
set-hook -g session-created 'run-shell -b "$HOME/go/bin/sesh cache refresh"'
set-hook -g session-closed  'run-shell -b "$HOME/go/bin/sesh cache refresh"'
set-hook -g client-session-changed  'run-shell -b "$HOME/go/bin/sesh cache refresh"'
set-hook -g pane-command-finished {
  if -F '#{&&:#{e|>=:#{pane_command_duration},10},#{!:#{&&:#{session_attached},#{&&:#{window_active},#{pane_active}}}}}' {
    run -b '[ "$(alerter --title "#{session_name}" --subtitle "#{window_name}" --message "exit #{pane_command_status} after #{pane_command_duration}s" --content-image "$HOME/c/claude-code-tools/notifier/icons/#{?#{==:#{pane_command_status},0},check,x}.png" --group "tmux-#{pane_id}" --timeout 1800)" = @CONTENTCLICKED ] && sesh connect --switch "#{session_name}" && open -b com.github.wez.wezterm'
  }
}
# set-hook -ga session-created 'run-shell -b "sesh rename --enrich \"#{hook_session_name}\""'

# bindings
bind -N "⌘+9 switch to root session (via sesh) " 9 run-shell "$HOME/go/bin/sesh connect --root $(pwd)"
bind -N "⌘+^+t join pane" J join-pane -t 1
bind -N "⌘+a ai" A run-shell tmux-claude-window
bind -N "⌘+b builder" b new-window -d 'build'
bind -N "⌘+d dev" D new-window -S -n '🔧' 'dev --hold'
bind -N "⌘+e editor" E new-window -S -n '📝' 'nvim'
bind -N "⌘+⇧+G gh-dash " G new-window -c "#{pane_current_path}" -n "😺" "ghd 2> /dev/null"
bind -N "⌘+g lazygit" g new-window -S -n '🌳' 'lazygit'
# bind -N "⌘+G git commit (raycast) " G new-window -c "#{pane_current_path}" -n "🔒" "raycast-git-commit.sh"
bind -N "⌘+l last-session (via sesh) " L run-shell "$HOME/go/bin/sesh last || tmux display-message -d 1000 'Only one session'"
# bind -N "⌘+⇧+Q kill current session" Q kill-session
bind -N "⌘+q kill current session" Q run-shell -b "tmux-kill-session '#{session_name}'"
bind -N "⌘+⇧+R run a script" Y split-window -v -l 10 "npm run (jq -r '.scripts | keys[]' package.json | fzf --no-border)"
bind -N "browse worktree issue (via sesh)" B run-shell "sesh worktree browse || tmux display-message -d 1000 'No worktree issue found'"

bind '%' split-window -c '#{pane_current_path}' -h
bind '"' split-window -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt (cmd+w)
bind-key e send-keys "tmux capture-pane -p -S - | nvim -c 'set buftype=nofile' +" Enter

# NOTE: can be used for debugging
# )\" 2> /tmp/sesh-$(date +"%Y-%m-%d-%H-%M-%S").txt"

bind-key "Z" display-popup -E "sesh connect \$(sesh list | zf --height 24)"

