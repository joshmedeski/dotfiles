[[session]]
name = "fish config"
icon = "🐟"
path = "/Users/joshmedeski/c/dotfiles/.config/fish"
preview_command = "bat --language=fish --style=snip --color=always ~/c/dotfiles/.config/fish/config.fish"
alias = "fc"
alias_auto_connect = true

[[session]]
name = "sesh config"
icon = "⚡"
path = "$HOME/c/dotfiles/.config/sesh"
startup_command = "nvim sesh.toml && exit"
preview_command = "bat --language=toml --style=snip --color=always $HOME/c/dotfiles/.config/sesh/sesh.toml"
alias = "sc"
alias_auto_connect = true

[[session]]
name = "tmux config"
icon = "🪟"
path = "~/c/dotfiles/.config/tmux"
startup_command = "nvim tmux.conf tmux-nerd-font-window-name.yml gitmux.yml && exit"
preview_command = "bat --language=bash --style=snip --color=always ~/c/dotfiles/.config/tmux/tmux.conf"
alias = "tc"
alias_auto_connect = true

[[session]]
name = "leaderkey config"
icon = "🔑"
path = "~/c/dotfiles/.config/leaderkey"
preview_command = "bat --language=bash --style=snip --color=always ~/c/dotfiles/.config/leaderkey/config.json"
startup_command = "nvim ~/c/dotfiles/.config/leaderkey/config.json && exit"
alias = "lk"
alias_auto_connect = true

[[session]]
name = "gitmux config"
