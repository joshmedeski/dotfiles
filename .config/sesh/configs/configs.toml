#:schema file:///Users/joshmedeski/c/sesh/main/sesh.schema.json

# "{name} config" sessions for jumping straight into a tool's config

[[session]]
name = "claude config"
icon = "🤖"
path = "~/.claude"
alias = "cc"
alias_auto_connect = true

[[session]]
name = "treekanga config"
icon = "🦘"
path = "~/c/dotfiles/.config/treekanga"
startup_command = "nvim treekanga.yml && exit"
alias = "tk"
alias_auto_connect = true

[[session]]
name = "aerospace config"
icon = "🪐"
path = "~/c/dotfiles/.config/aerospace"
startup_command = "nvim aerospace.toml && exit"
preview_command = "bat --language=bash --style=snip --color=always ~/c/dotfiles/.config/aerospace/aerospace.toml"
alias = "ac"
alias_auto_connect = true

