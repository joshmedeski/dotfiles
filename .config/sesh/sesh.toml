#
# Smart session manager for the terminal
# https://github.com/joshmedeski/sesh

strict_mode = false
cache = true
separator_aware = true
dir_length = 2
# macOS: bring this app to the front after a connect made from outside tmux
# (leaderkey, osascript), so the session you asked for is the one in front of you.
terminal = "wezterm"
# git_namer_use_worktree_root = true
# git_dir_length = 2

import = [
  # "~/.config/sesh/configs/nu-sesh.toml",
  # "~/.config/sesh/configs/raycast-extensions.toml",
  "~/.config/sesh/configs/windows.toml",
  "~/.config/sesh/configs/configs.toml",
]

[[name_substitution]]
find = "~/c/dotfiles/.config/"
replace = ""

# TODO: test dashboard
[dashboard]
title = "My Dashboard"

[[dashboard.sections]]
type = "sessions"
title = "Sessions"
width = 0.4
row = 0
groups = [{ name = "Nutiliti", patterns = ["~/c/nu/w*"] }]

# TODO: test dashboard

# Use memy as the frecency backend instead of zoxide (tracks files + dirs).
# {} is replaced with the query/path. Omit a field to fall back to zoxide.
# [frecency]
# list_command = "memy list -d"
# query_command = "memy list -d --head 1 {}"
# add_command = "memy note {}"
# TODO:: add reverse support if memy doesn't support it
# https://github.com/andrewferrier/memy/issues/172
# reverse = true

[tui]
show_icons = true
show_windows = true
prompt = "⚡"
placeholder = "Choose a session"
preview = true
preview_border = 'none'

# Read the active browser tab URL (macOS) for `sesh worktree connect --browser`.
[browser]
application = "Helium"
# url_command = "URL of active tab of front window"  # optional; Safari uses "URL of current tab of front window"

# Map each repo to its local checkout so `sesh worktree connect -b` can turn an open
# issue/PR tab into a worktree under <path>/<worktree_dir>/<number>.
#
# create_command  runs once, on the connect that creates the worktree (setup)
# startup_command runs when connecting to a worktree that already existed
# The two are exclusive -- chain with && if you want both on creation.
[[worktree]]
repo = "joshmedeski/sesh"
path = "~/c/sesh"
worktree_dir = "w"
branch_template = "{number}"
base_branch = "origin/main"

[[worktree]]
repo = "Nutiliti/nutiliti"
path = "~/c/nu"
worktree_dir = "w"
branch_template = "jam/{number}-1"
base_branch = "origin/main"
create_command = "nu_setup"

[[worktree]]
repo = "joshmedeski/joshmedeski.com"
path = "~/c/joshmedeski_com"
worktree_dir = "w"
branch_template = "{number}"
base_branch = "origin/main"
create_command = "pnpm i"

# sort_order = ["tmux", "config", "tmuxinator", "zoxide"]
# sort_order = ["tmux", "config", "tmuxinator", "zoxide"]
# blacklist_sources = ["tmux", "zoxide"]


# projects
# project_roots = ["~/c"]
# max_depth = 2
# sort_order = ["tmux", "projects"]

